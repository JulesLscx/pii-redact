name: pii-redact
version: "0.1.0"
description: >-
  Pseudonymizes personal data before any LLM send and restores it locally on the
  way back. Detection is 100% deterministic by default (French rules for IBAN,
  NIR, SIRET, card numbers, phone, email, address, postal code, license plate,
  and title/field-anchored names), completed by a persistent literal directory:
  any known value is redetected everywhere, permanently. Optional spaCy NER
  (PII_REDACT_NER=1). The token -> real-value mapping stays in local SQLite with
  0600 permissions and is never transmitted. Four hook points are covered:
  outbound tool results and provider payload, inbound local tool arguments, and
  final model output, so agent capabilities remain intact on real data.
author: "Jules Lascoux"
kind: standalone
# `provides_hooks` is the key Hermes' manifest parser actually reads
# (hermes_cli/plugins.py::_parse_manifest), and it drives `hermes plugins list`.
# The bundled `security-guidance` example declares `hooks:` instead, which the
# parser ignores — both are listed here so the manifest is correct today and
# still readable to anyone comparing it with that example.
provides_hooks:
  - transform_tool_result
  - transform_llm_output
  - pre_tool_call
  - on_session_start
  - on_session_reset
hooks:
  - transform_tool_result
  - transform_llm_output
  - pre_tool_call
  - on_session_start
  - on_session_reset
middleware:
  - llm_request
  - tool_request
